name: Build Windows executable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6.10,<7"

      - name: Build server
        run: |
          pyinstaller --clean --noconfirm deploy/gemini_web2api_manage.spec

      - name: Build manager
        run: |
          pyinstaller --clean --noconfirm build/pyinstaller/GeminiWeb2API_Manager.spec

      - name: Assemble package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release\GeminiWeb2API-Manage-Windows-x64
          Copy-Item dist\gemini-web2api-manage\gemini-web2api-manage.exe release\GeminiWeb2API-Manage-Windows-x64\gemini_web2api_server.exe
          Copy-Item dist\GeminiWeb2API_Manager.exe release\GeminiWeb2API-Manage-Windows-x64\
          Copy-Item config.example.json release\GeminiWeb2API-Manage-Windows-x64\
          Compress-Archive `
            -Path release\GeminiWeb2API-Manage-Windows-x64 `
            -DestinationPath release\GeminiWeb2API-Manage-Windows-x64.zip

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: GeminiWeb2API-Manage-Windows-x64
          path: release\GeminiWeb2API-Manage-Windows-x64.zip
