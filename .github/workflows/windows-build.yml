name: Build Windows executable

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64 package
    runs-on: windows-2022

    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6.10,<7"

      - name: Build server executable
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm deploy/gemini_web2api_manage.spec

      - name: Build desktop manager
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm build/pyinstaller/GeminiWeb2API_Manager.spec

      - name: Verify build outputs
        shell: pwsh
        run: |
          Write-Host "Checking server executable..."
          if (!(Test-Path "dist\gemini-web2api-manage.exe")) {
            Write-Error "Server executable not found: dist\gemini-web2api-manage.exe"
            exit 1
          }

          Write-Host "Checking manager executable..."
          if (!(Test-Path "dist\GeminiWeb2API_Manager.exe")) {
            Write-Error "Manager executable not found: dist\GeminiWeb2API_Manager.exe"
            exit 1
          }

          Get-Item "dist\gemini-web2api-manage.exe"
          Get-Item "dist\GeminiWeb2API_Manager.exe"

      - name: Assemble Windows package
        shell: pwsh
        run: |
          $PackageDir = "release\GeminiWeb2API-Manage-Windows-x64"
          $ZipFile = "release\GeminiWeb2API-Manage-Windows-x64.zip"

          New-Item -ItemType Directory -Force -Path $PackageDir | Out-Null

          # 服务端 exe：注意这里是 dist\gemini-web2api-manage.exe，
          # 不是 dist\gemini-web2api-manage\gemini-web2api-manage.exe
          Copy-Item `
            "dist\gemini-web2api-manage.exe" `
            "$PackageDir\gemini_web2api_server.exe"

          # Windows 桌面管理器
          Copy-Item `
            "dist\GeminiWeb2API_Manager.exe" `
            "$PackageDir\GeminiWeb2API_Manager.exe"

          # 配置模板
          Copy-Item `
            "config.example.json" `
            "$PackageDir\config.example.json"

          # 文档和许可证
          Copy-Item `
            "README.md" `
            "$PackageDir\README.md"

          Copy-Item `
            "CHANGELOG.md" `
            "$PackageDir\CHANGELOG.md"

          Copy-Item `
            "LICENSE" `
            "$PackageDir\LICENSE"

          # 生成启动说明
          @"
          Gemini Web2API Manage - Windows x64

          使用方法：

          1. 复制 config.example.json 为 config.json。
          2. 根据需要修改 config.json。
          3. 双击 GeminiWeb2API_Manager.exe。
          4. 在管理器中启动服务。
          5. 管理台地址默认为：
             http://127.0.0.1:8081/admin

          如果不使用桌面管理器 ，也可以在命令行运行：

          gemini_web2api_server.exe --port 8081

          API 地址：

          http://127.0.0.1:8081/v1
          "@ | Set-Content `
            -Path "$PackageDir\使用说明.txt" `
            -Encoding UTF8

          # 打包 ZIP
          Compress-Archive `
            -Path $PackageDir `
            -DestinationPath $ZipFile `
            -Force

          # 输出文件列表和 SHA256
          Write-Host ""
          Write-Host "Package contents:"
          Get-ChildItem -Recurse $PackageDir

          Write-Host ""
          Write-Host "SHA256:"
          Get-FileHash $ZipFile -Algorithm SHA256

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: GeminiWeb2API-Manage-Windows-x64
          path: release/GeminiWeb2API-Manage-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
